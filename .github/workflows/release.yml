name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6

      - name: Resolve version
        run: |
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
          if [[ "$TAG" == *-* ]]; then echo "PRERELEASE=--prerelease" >> "$GITHUB_ENV"; fi

      - name: Build and test
        run: ./gradlew build shadowJar -Pversion="$VERSION"

      - name: Generate changelog
        run: |
          gh api "repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="$TAG" --jq .body > build/release-notes.md

      - name: Create GitHub release
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" build/libs/*-all.jar --clobber
          else
            gh release create "$TAG" build/libs/*-all.jar \
              --title "$TAG" --notes-file build/release-notes.md $PRERELEASE
          fi

      - name: Publish to Modrinth and Hangar
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ secrets.MODRINTH_PROJECT_ID }}
          HANGAR_API_TOKEN: ${{ secrets.HANGAR_API_TOKEN }}
          HANGAR_PROJECT_ID: ${{ secrets.HANGAR_PROJECT_ID }}
        run: ./gradlew modrinth publishPluginPublicationToHangar --no-configuration-cache -Pversion="$VERSION"

      - name: Publish API to Maven Central
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew publishAggregationToCentralPortal --no-configuration-cache -Pversion="$VERSION"
