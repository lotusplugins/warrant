name: Warrant
version: '${version}'
main: com.lotusplugins.warrant.WarrantPlugin
description: Simple and effective punishment plugin
api-version: '26.2'
folia-supported: true
softdepend: [LuckPerms, Vault]
libraries:
  - org.hsqldb:hsqldb:2.7.4
permissions:
  warrant.ban:
    description: Issue permanent player bans.
    default: op
  warrant.tempban:
    description: Issue temporary player bans.
    default: op
  warrant.unban:
    description: Revoke player bans.
    default: op
  warrant.mute:
    description: Issue permanent player mutes.
    default: op
  warrant.tempmute:
    description: Issue temporary player mutes.
    default: op
  warrant.unmute:
    description: Revoke player mutes.
    default: op
  warrant.warn:
    description: Issue player warnings.
    default: op
  warrant.unwarn:
    description: Revoke player warnings.
    default: op
  warrant.kick:
    description: Kick players and record the punishment.
    default: op
  warrant.history:
    description: View a player's punishment history.
    default: op
  warrant.notify:
    description: Receive silent punishment announcements.
    default: op
  warrant.import:
    description: Import punishment history from the server console.
    default: false
  warrant.exempt:
    description: Exempt a player from staff punishments; operators are not automatically exempt.
    default: false
  warrant.moderator:
    description: Mute, warn, kick, view history and receive staff notifications.
    default: false
    children:
      warrant.mute: true
      warrant.tempmute: true
      warrant.unmute: true
      warrant.warn: true
      warrant.unwarn: true
      warrant.kick: true
      warrant.history: true
      warrant.notify: true
  warrant.admin:
    description: All moderation and migration commands, without exemption.
    default: false
    children:
      warrant.moderator: true
      warrant.ban: true
      warrant.tempban: true
      warrant.unban: true
      warrant.import: true
  warrant.*:
    description: All punishment permissions, including explicit exemption.
    default: false
    children:
      warrant.admin: true
      warrant.exempt: true
